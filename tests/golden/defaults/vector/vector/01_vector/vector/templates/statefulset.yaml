apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/component: Aggregator
    app.kubernetes.io/instance: vector
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vector
    app.kubernetes.io/version: 0.55.0-distroless-libc
    helm.sh/chart: vector-0.52.0
  name: vector
  namespace: syn-vector
spec:
  minReadySeconds: 0
  podManagementPolicy: OrderedReady
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: Aggregator
      app.kubernetes.io/instance: vector
      app.kubernetes.io/name: vector
  serviceName: vector-headless
  template:
    metadata:
      annotations:
        checksum/config: 9689c15cc2ade8f68f33cf39f534f5877b504362168acc00963d8cac2f9474ee
      labels:
        app.kubernetes.io/component: Aggregator
        app.kubernetes.io/instance: vector
        app.kubernetes.io/name: vector
        vector.dev/exclude: 'true'
    spec:
      containers:
        - args:
            - --config-dir
            - /etc/vector/
          env:
            - name: VECTOR_LOG
              value: info
          image: docker.io/timberio/vector:0.55.0-distroless-libc
          imagePullPolicy: IfNotPresent
          name: vector
          ports:
            - containerPort: 8282
              name: datadog-agent
              protocol: TCP
            - containerPort: 24224
              name: fluent
              protocol: TCP
            - containerPort: 5044
              name: logstash
              protocol: TCP
            - containerPort: 8080
              name: splunk-hec
              protocol: TCP
            - containerPort: 8125
              name: statsd
              protocol: TCP
            - containerPort: 9000
              name: syslog
              protocol: TCP
            - containerPort: 6000
              name: vector
              protocol: TCP
            - containerPort: 9090
              name: prom-exporter
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8686
          volumeMounts:
            - mountPath: /vector-data-dir
              name: data
            - mountPath: /etc/vector/
              name: config
              readOnly: true
      dnsPolicy: ClusterFirst
      serviceAccountName: vector
      terminationGracePeriodSeconds: 60
      volumes:
        - emptyDir: {}
          name: data
        - name: config
          projected:
            sources:
              - configMap:
                  name: vector
  volumeClaimTemplates: null
